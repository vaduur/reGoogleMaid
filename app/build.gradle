plugins { id 'com.android.application' }
android {
    namespace 'dev.local.ace6tdiscover'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.local.ace6tdiscover'
        minSdk 36
        targetSdk 36
        versionCode 12
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Developer builds use the locally generated Android debug key.
    // The signing key used for published APKs is not part of this repository.
    buildTypes { debug { debuggable false } }
}
configurations.configureEach {
    resolutionStrategy.force 'org.bouncycastle:bcprov-jdk15to18:1.81', 'org.bouncycastle:bcutil-jdk15to18:1.81'
}
dependencies {
    implementation project(':adbclient')
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}

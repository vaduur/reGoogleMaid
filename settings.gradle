pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    resolutionStrategy { eachPlugin { if (requested.id.id.startsWith('com.android.')) useModule('com.android.tools.build:gradle:8.13.0') } }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral(); maven { url 'https://jitpack.io'; content { includeGroup 'com.github.MuntashirAkon.spake2-java' } } }
}
rootProject.name = 'reGoogleMaid'
include ':app', ':adbclient'
project(':adbclient').projectDir = file('third_party/adbclient')
